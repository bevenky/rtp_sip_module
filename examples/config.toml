# pyswitch Configuration Example
#
# Load with:
#   from pyswitch import Config
#   config = Config.from_file("config.toml")
#
# Or create programmatically:
#   config = Config(mode="rtp_only")
#   config.rtp_port_start = 16384

# Operation mode: "rtp_only" or "sip"
# - rtp_only: External SIP signaling (WebSocket, etc.), pyswitch handles RTP
# - sip: Full SIP mode, pyswitch handles both SIP signaling and RTP
mode = "rtp_only"

# RTP Configuration
[rtp]
# Local IP to bind RTP sockets (0.0.0.0 = all interfaces)
local_ip = "0.0.0.0"

# RTP port range (for auto-allocation)
port_start = 16384
port_end = 32768

# Default codec: "PCMU" or "PCMA"
codec = "PCMU"

# SIP Configuration (used when mode = "sip")
[sip]
# Local IP for SIP
local_ip = "0.0.0.0"

# Local SIP port
local_port = 5060

# External IP for NAT traversal (optional)
# Use this if behind NAT and need to advertise public IP in SDP
# external_ip = "203.0.113.10"

# Enable SIP debug logging
debug = false


# SIP Trunks (used when mode = "sip")
# Each trunk defines an outbound gateway

[[trunks]]
name = "twilio"
host = "sip.twilio.com"
port = 5060
username = "AC1234567890abcdef"
password = "your_auth_token"
transport = "udp"
codecs = "PCMU,PCMA"
caller_id_name = "My Voice Bot"
caller_id_number = "+15551234567"

[[trunks]]
name = "telnyx"
host = "sip.telnyx.com"
port = 5060
username = "your_username"
password = "your_password"
transport = "tls"
codecs = "PCMU"

[[trunks]]
name = "custom"
host = "192.168.1.100"
port = 5080
# No auth - IP whitelist
transport = "udp"
codecs = "PCMU,PCMA"
