name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI'
        required: true
        default: 'false'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build wheels for all platforms
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============================================
          # Linux (manylinux - Debian, Ubuntu, CentOS, Fedora, RHEL, etc.)
          # ============================================

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014

          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux2014

          # Linux i686 (32-bit)
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            manylinux: manylinux2014

          # ============================================
          # Linux musl (Alpine, lightweight containers)
          # ============================================

          # Alpine x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_1

          # Alpine aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_1

          # ============================================
          # macOS
          # ============================================

          # macOS x86_64 (Intel)
          - os: macos-13
            target: x86_64-apple-darwin

          # macOS arm64 (Apple Silicon M1/M2/M3)
          - os: macos-14
            target: aarch64-apple-darwin

          # ============================================
          # Windows
          # ============================================

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # Windows i686 (32-bit)
          - os: windows-latest
            target: i686-pc-windows-msvc

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  # Build source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI
  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/rtpsip/
    permissions:
      id-token: write  # For trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # For first-time setup, use API token:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          # After setup, use trusted publishing (no token needed)

  # Publish to TestPyPI (for testing releases)
  publish-test:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rtpsip/
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
