[workspace]

[package]
name = "rtpsip"
version = "0.1.0"
edition = "2021"
description = "High-performance SIP/RTP library for Voice AI"
license = "MIT"
readme = "README.md"
keywords = ["sip", "rtp", "voip", "telephony", "voice-ai"]

[lib]
name = "rtpsip"
crate-type = ["cdylib", "rlib"]

[dependencies]
# SIP Stack
# NOTE: rsip-dns (transitive dep) uses nom 6.1.2 with future-incompatible macro.
# Waiting for upstream fix: https://github.com/vaorhern/rsip-dns/issues
rsipstack = "0.3"
rsip = "0.4"

# RTP
rtp = "0.14"
webrtc-util = "0.12"

# Jitter Buffer (disable default features to avoid native deps)
neteq = { version = "0.8", default-features = false }

# G.711 Codec
audio-codec-algorithms = "0.7"

# Async Runtime
tokio = { version = "1", features = ["full", "sync", "rt-multi-thread"] }

# PyO3 Bindings
pyo3 = { version = "0.22", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# Utilities
dashmap = "6"
parking_lot = "0.12"
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[features]
default = []
